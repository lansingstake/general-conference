  :root {
    --bg: #f1f1f1;

    --speaker: #9d355c;
    --link: #222;
    --lifehelp: #5b5b5b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Arial", "Helvetica Neue", Helvetica, sans-serif;
  }
  .page {
    max-width: 720px;
    margin: 0 auto;
    padding: 10px 40px 48px;
  }
  .page-title {
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 400;
    font-size: 3.2rem;
    line-height: 1.02;
    letter-spacing: -0.02em;
    margin: 0 0 42px;
  }
  .back-link {
    display: inline-block;
    margin: 18px 0 14px;
    font-size: 0.9rem;
    color: #666;
    text-decoration: none;
  }
  .back-link:hover { text-decoration: underline; }
  .session-label {
    font-weight: 300;
    font-size: 1.06rem;
    letter-spacing: .02em;
    color: #707070;
    text-transform: uppercase;
    margin-top: 16px;
    margin-bottom: 10px;
  }
  .session-title {
    font-weight: 300;
    font-size: 2.1rem;
    line-height: 1.15;
    margin: 0 0 22px;
    color: #333;
  }
  .tile {
    display: grid;
    grid-template-columns: 140px 1fr;
    gap: 20px;
    align-items: start;
    padding: 18px 0 24px;
    border-bottom: 1px solid var(--card-border);
  }
  .tile img {
    width: 140px;
    height: 79px;
    object-fit: cover;
    display: block;
    background: #ddd;
  }
  .speaker {
    font-size: 0.9rem;
    line-height: 1.2;
    color: var(--speaker);
    margin: 0 0 4px;
    letter-spacing: .01em;
  }
  .talk-title {
    font-size: 1.05rem;
    line-height: 1.25;
    margin: 0 0 8px;
    font-weight: 700;
  }
  .talk-title a {
    color: var(--link);
    text-decoration: none;
  }
  .talk-title a:hover {
    text-decoration: underline;
  }
  .description {
    font-size: 0.93rem;
    line-height: 1.5;
    color: var(--muted);
    margin: 0;
  }
  .life-help {
    margin-top: 10px;
    font-size: 0.86rem;
    line-height: 1.45;
    color: var(--lifehelp);
  }
  .life-help strong {
    color: #454545;
  }
  .life-help a {
    color: #666;
    text-decoration: none;
    border-bottom: 1px solid transparent;
  }
  .life-help a:hover {
    border-bottom-color: #666;
  }
  .session-card .talk-title {
    margin-top: 4px;
  }
  .footer-note {
    margin-top: 30px;
    font-size: 0.8rem;
    color: #767676;
    line-height: 1.5;
  }
  @media (max-width: 640px) {
    .page { padding: 14px 18px 36px; }
    .page-title { font-size: 2.65rem; margin-bottom: 28px; }
    .session-title { font-size: 1.8rem; }
    .tile {
      grid-template-columns: 110px 1fr;
      gap: 14px;
      padding: 16px 0 22px;
    }
    .tile img {
      width: 110px;
      height: 62px;
    }
  }
  @media (max-width: 450px) {
    .tile {
      grid-template-columns: 1fr;
    }
    .tile img {
      width: 100%;
      max-width: 160px;
      height: auto;
      aspect-ratio: 16 / 9;
    }
  }
</style>
</head>

function escapeHtml(str) {
  return str
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#39;');
}

function renderLifeTopics(topics) {
  if (!topics || !topics.length) return '';
  const links = topics.map(t => `<a href="${t.url}" target="_blank" rel="noopener noreferrer">${escapeHtml(t.title)}</a>`).join(' | ');
  return `<div class="life-help"><strong>Relevant Life Helps:</strong> ${links}</div>`;
}

function renderTile(item, isSessionCard = false) {
  const speaker = item.speaker ? `<p class="speaker">${escapeHtml(item.speaker)}</p>` : '';
  const titleLink = item.href
    ? `<a href="${item.href}" target="_blank" rel="noopener noreferrer">${escapeHtml(item.title)}</a>`
    : escapeHtml(item.title);
  return `
    <article class="tile ${isSessionCard ? 'session-card' : ''}">
      <div class="image-wrap">
        <img src="${item.img || ''}" alt="${escapeHtml(item.title)}" loading="lazy">
      </div>
      <div class="content">
        ${speaker}
        <h3 class="talk-title">${titleLink}</h3>
        <p class="description">${escapeHtml(item.description)}</p>
        ${renderLifeTopics(item.life_topics)}
      </div>
    </article>
  `;
}

function render() {
  const app = document.getElementById('app');
  let html = `<a class="back-link" href="../">&larr; All conferences</a><h1 class="page-title">${escapeHtml(pageTitle)}</h1>`;
  conferenceData.forEach(section => {
    html += `
      <section class="session">
        <div class="session-label">Session</div>
        <h2 class="session-title">${escapeHtml(section.session)}</h2>
        ${renderTile(section.items[0], true)}
        ${section.items.slice(1).map(item => renderTile(item)).join('')}
      </section>
    `;
  });
  html += `<p class="footer-note">${escapeHtml(footerNote)}</p>`;
  app.innerHTML = html;
}

render();
